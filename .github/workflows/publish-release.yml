name: Publish Release

# 一键发布正式版：从当前 main 创建 Release，然后构建并上传二进制、生成 Release Notes。
# 用 GITHUB_TOKEN 创建的 Release 不会触发 release 事件，所以这里直接调用对应的工作流。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 1.5.12-fork"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate request
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish Release must be run on main (got $GITHUB_REF)"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]]; then
            echo "::error::Invalid tag '$TAG', expected a version such as 1.5.12-fork"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "" \
            --latest

  release-notes:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run generate-release-notes.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="${{ inputs.tag }}"

  binaries:
    needs: create-release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  docker:
    needs: create-release
    uses: ./.github/workflows/release-docker.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
